<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: on phones the app draws under the notch and the home indicator, padding itself with env(safe-area-inset-*).
         Pinch zoom stays allowed (accessibility); fields are 16px on touch screens so iOS doesn't zoom into them (index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FireFunds - Personal finance & net worth tracking" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Dark mode from the first frame: no white flash (blocking on purpose). -->
    <script src="/theme-init.js"></script>

    <!-- Installable as an app (PWA): Android/Chrome read the manifest, iOS the apple-* tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FireFunds" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <title>FireFunds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
