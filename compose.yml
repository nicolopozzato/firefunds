# FireFunds, self-hosted. Next to this file you need its .env (see README):
#
#   docker compose up -d                          start
#   docker compose pull && docker compose up -d   update
#
# Database migrations run when the new `app` container starts.
# Data lives in ./data (database, JWT keys, scheduler state, backups). The app
# makes database backups into ./data/backups on a schedule the administrator
# sets (Administration → Backups): keep a copy of them, and of this file and
# .env, somewhere else.

x-app: &app
  image: ghcr.io/nicolopozzato/firefunds:${FIREFUNDS_TAG:-latest}
  restart: unless-stopped
  environment: &app-env
    APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
    JWT_PASSPHRASE: ${JWT_PASSPHRASE:?set JWT_PASSPHRASE in .env}
    DATABASE_URL: postgresql://firefunds:${POSTGRES_PASSWORD}@database:5432/firefunds?serverVersion=18&charset=utf8
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-PRIVATE_SUBNETS}
    APP_TIMEZONE: ${TIMEZONE:-Europe/Rome}
  volumes:
    - ./data/jwt:/app/backend/config/jwt
    - ./data/share:/app/backend/var/share
    - ./data/backups:/app/backend/var/backups
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: firefunds
      POSTGRES_USER: firefunds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ keeps its data in a per-version folder under here.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefunds -d firefunds"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FrankenPHP: the React app on /, the Symfony API on /api.
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"

  # Symfony Scheduler (prices, exchange rates, backups; Administration → Scheduled tasks):
  # exits every hour and is restarted.
  scheduler:
    <<: *app
    command: php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=128M -v
    # The image's healthcheck is FrankenPHP's, which doesn't run here.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
