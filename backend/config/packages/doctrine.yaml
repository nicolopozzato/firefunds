doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Each PHP server worker keeps its connection between requests: opening
        # one costs ~18 ms (SCRAM-SHA-256 login) on every authenticated request,
        # ~40% of a dev request (measured 2026-10-05). PDO rolls back a
        # transaction left open when a request ends, and reconnects if
        # Postgres went away.
        persistent: true

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        dql:
            string_functions:
                # SUM(CONVERTED(amount, currency, day, :target, :user)): each amount at its day's rate.
                CONVERTED: App\Core\Doctrine\ConvertedFunction
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        filters:
            soft_delete:
                class: App\Core\Doctrine\SoftDeleteFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
