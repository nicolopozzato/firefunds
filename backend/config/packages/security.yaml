security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Tokens (JWT and refresh) name the user by id, which never changes;
    # only the login form looks a user up by email. See User::getUserIdentifier().
    providers:
        users_by_id:
            entity:
                class: App\Entity\User   # UserRepository::loadUserByIdentifier
        users_by_email:
            id: App\Auth\Security\EmailUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            provider: users_by_email
            user_checker: App\Auth\Security\UserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Against brute force: 5 failed
            # attempts per email and IP, 25 per IP, every 15 minutes. A successful
            # login resets the count. Answered with a 429 (LoginThrottledListener).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
                storage_service: login_throttling.storage

        register:
            pattern: ^/api/auth/register
            stateless: true
            security: false

        # Refresh and logout live here too (gesdinet_jwt_refresh_token.yaml):
        # a refresh token is single use, every refresh hands out a new one,
        # and logout deletes the one it is sent.
        api:
            pattern: ^/api
            stateless: true
            provider: users_by_id
            # A disabled user is refused by the JWT and refresh authenticators too.
            user_checker: App\Auth\Security\UserChecker
            jwt: ~
            # Personal access tokens (Bearer ff_…) for other programs: App\Api\Security.
            custom_authenticators:
                - App\Api\Security\ApiTokenAuthenticator
            entry_point: jwt
            refresh_jwt:
                check_path: api_auth_refresh
                invalidate_token_on_logout: true
            logout:
                path: api_auth_logout

        main:
            lazy: true
            provider: users_by_id

    access_control:
        - { path: ^/api/auth/(login|register|refresh|logout|check-registration)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
