lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # 15 minutes: nothing revokes an access token, so this is how long one
    # outlives a logout or a password change. The frontend refreshes it.
    token_ttl: 900
