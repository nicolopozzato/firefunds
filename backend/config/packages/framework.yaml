# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Requests arrive through a reverse proxy: take the client IP from
    # X-Forwarded-For, which login throttling counts attempts by. Trusted only
    # from TRUSTED_PROXIES (private networks by default: Docker's, whatever
    # pool it picks). The proxy must add the client's address to the header,
    # not pass on what the client sent (Traefik, Caddy and nginx do).
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for']

    # Yahoo Finance (YahooFinancePriceProvider, as $yahooClient): a slow or
    # stuck answer must not hold a request or the price fetch for long.
    http_client:
        scoped_clients:
            # The ECB's exchange rates (EcbExchangeRateProvider): a large file once, a small one daily.
            ecb.client:
                base_uri: 'https://www.ecb.europa.eu/stats/eurofxref/'
                timeout: 10
                max_duration: 60
                max_redirects: 3
            yahoo.client:
                base_uri: 'https://query1.finance.yahoo.com/v8/finance/chart/'
                timeout: 5
                max_duration: 15
                headers:
                    User-Agent: 'Mozilla/5.0'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
