# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Failed logins, per email (EmailLoginRateLimiter, security.yaml).
    rate_limiter:
        login:
            policy: fixed_window
            limit: 10
            interval: '15 minutes'
            storage_service: login_throttling.storage

    # Yahoo Finance (YahooFinancePriceProvider, as $yahooClient): a slow or
    # stuck answer must not hold a request or the price fetch for long.
    http_client:
        scoped_clients:
            # The ECB's exchange rates (EcbExchangeRateProvider): a large file once, a small one daily.
            ecb.client:
                base_uri: 'https://www.ecb.europa.eu/stats/eurofxref/'
                timeout: 10
                max_duration: 60
                max_redirects: 3
            # The latest FireFunds release (GitHubReleases), twice a day.
            github.client:
                base_uri: 'https://api.github.com/repos/nicolopozzato/firefunds/'
                timeout: 10
                max_duration: 20
                headers:
                    Accept: 'application/vnd.github+json'
                    User-Agent: 'FireFunds'
            yahoo.client:
                base_uri: 'https://query1.finance.yahoo.com/v8/finance/chart/'
                timeout: 5
                max_duration: 15
                headers:
                    User-Agent: 'Mozilla/5.0'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
