# The checks every change must pass: the backend test suite (against
# PostgreSQL, as in production) and the frontend's type check, lint, unit tests
# and build. Run on every push and pull request, and by image.yml before it
# publishes an image.
#
# Actions are pinned to a commit (the version in the comment): a moved tag
# can't change what runs here.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: firefunds_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      # The test environment adds "_test" to the database name.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/firefunds?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_pgsql, zip
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: JWT keys for the tests
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: Database schema
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
